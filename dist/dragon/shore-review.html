<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mountain shore review</title><style>*{box-sizing:border-box}body{margin:0;background:#183b46;color:#f4eddb;font:14px system-ui;text-align:center}header{padding:14px}button{padding:9px 16px;background:#e6d5a5;color:#183b46;border:0;border-radius:9px;margin:4px;font-weight:700}canvas{display:block;margin:0 auto;max-width:100%;border:1px solid #d8dac7;border-radius:14px}p{font-size:12px;opacity:.8}h1{font-size:20px;margin:3px}</style></head><body><header><h1>Photographic mountain shores</h1><p>Exact runtime shore textures, projected through the game camera. Software review, not a water-shader preview.</p><button id="phone">Phone</button><button id="wide">Wide</button><button id="toggle">Hide new shore layers</button></header><canvas id="view" aria-label="Projected photographic mountain and forest shoreline review"></canvas><script type="module">
import * as T from '../store/vendor/three.module.min.js';
import {SHORE_PANELS,createShoreCanvas,drawProjectedShore} from './photo-shores.mjs?v=mountains-48';
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),camera=new T.PerspectiveCamera(),image=new Image();let width=390,height=430,show=true,layers=[];
function render(){const d=Math.min(devicePixelRatio||1,2);canvas.width=width*d;canvas.height=height*d;canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingQuality='high';ctx.fillStyle='#93afbd';ctx.fillRect(0,0,width,height);const portrait=width/height<.85;camera.fov=portrait?65:57;camera.aspect=width/height;camera.near=.1;camera.far=1400;camera.position.set(0,portrait?10.5:9.6,portrait?-21:-15.8);camera.lookAt(0,7.6,35);camera.updateProjectionMatrix();camera.updateMatrixWorld();drawProjectedShore(ctx,canvas,camera,{canvas:image,pose:{x:0,y:100,z:650,width:1400,height:933}},width,height);if(show)for(const p of layers)drawProjectedShore(ctx,canvas,camera,p,width,height);}
image.onload=()=>{layers=SHORE_PANELS.map(spec=>({spec,canvas:createShoreCanvas(image,spec.side)}));render();};image.src='art/fjord-v45.webp';document.getElementById('phone').onclick=()=>{width=390;height=430;render();};document.getElementById('wide').onclick=()=>{width=1100;height=600;render();};document.getElementById('toggle').onclick=e=>{show=!show;e.target.textContent=show?'Hide new shore layers':'Show new shore layers';render();};
</script></body></html>
